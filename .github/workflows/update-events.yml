name: Update marathon events

on:
  schedule:
    # GitHub cron uses UTC. 22:15 UTC is 06:15 the next day in China.
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-marathon-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch current events
        run: python scripts/fetch_sources.py

      - name: Validate collected data
        run: python -c "import json; from pathlib import Path; events = json.loads(Path('data/events.json').read_text(encoding='utf-8')); assert events, 'No events collected; refusing to publish an empty data file'; print(f'Validated {len(events)} events')"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "Event data is unchanged."
          else
            git commit -m "Update marathon event data"
            git push
          fi
