<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Marathon</title><style>:root{color-scheme:dark}body{margin:0;background:#101512;color:#edf5ef;font:15px Arial,"Microsoft YaHei",sans-serif}main{max-width:960px;margin:auto;padding:38px 18px}.eyebrow{color:#55d595;letter-spacing:1.5px;font-size:12px;font-weight:bold}h1{font-size:38px;margin:8px 0}.sub,.meta{color:#a9b7ae}.stats{display:flex;gap:30px;border-bottom:1px solid #2b382f;padding:20px 0}.stats b{display:block;font-size:27px}.filters{display:flex;justify-content:space-between;padding:20px 0;gap:12px}button,select{background:#18221c;color:#dce8df;border:1px solid #3b4b41;padding:9px 12px}button.active{background:#55d595;color:#102116;border-color:#55d595}.list{display:grid;gap:10px}article{background:#18221c;border:1px solid #2d3b32;padding:18px;display:flex;justify-content:space-between;gap:16px;box-shadow:0 10px 24px #05080633}h2{font-size:17px;margin:7px 0}.tag{color:#55d595;font-size:12px;font-weight:bold}.today{color:#ff8271}.deadline{text-align:right}.deadline a{display:block;color:#65dca0;margin-top:7px;font-size:13px}@media(max-width:600px){main{padding:30px 16px}h1{font-size:30px}.filters,article{flex-direction:column}.filters div{display:flex;overflow:auto}.filters button{white-space:nowrap}.deadline{text-align:left}}</style><main><p class="eyebrow">PROJECT MARATHON</p><h1>重点赛事赛历</h1><p class="sub">只保留值得占用一个周末的比赛。</p><div class="stats"><span><b id="total">-</b>重点赛事</span><span><b id="today">-</b>今日截止</span><span><b id="week">-</b>本周截止</span></div><section class="filters"><div id="filters"></div><select id="region"><option>全部地区</option></select></section><section id="list" class="list">正在读取最新赛事数据...</section></main><script>const cities=['北京','上海','广州','深圳','成都','重庆','杭州','武汉','西安','天津','苏州','南京','长沙','郑州','青岛','厦门','济南'];let all=[],filter='全部';const fmt=v=>v?new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Shanghai'}).format(new Date(v)):'待公布',status=e=>{let d=(new Date(e.registration_end)-Date.now())/864e5;return d<1?'今日截止':d<=7?'本周截止':'报名中'},priority=e=>e.category==='A类'||cities.some(c=>(e.name+e.province).includes(c))||/金牌|金标|白金|锦标/.test(e.name);function render(){let x=all.filter(e=>(filter==='全部'||status(e)===filter)&&(region.value==='全部地区'||e.province===region.value));list.innerHTML=x.map(e=>`<article><div><span class="tag ${status(e)==='今日截止'?'today':''}">${status(e)}</span><h2>${e.name}</h2><p class="meta">${e.province} · 比赛 ${fmt(e.race_date)} · ${e.category}</p></div><div class="deadline">报名截止<br><b>${fmt(e.registration_end)}</b><a href="${e.source_url}" target="_blank">查看来源</a></div></article>`).join('')||'没有符合筛选条件的赛事。'}fetch('https://raw.githubusercontent.com/linyinzhou/project-marathon/main/data/events.json').then(r=>r.json()).then(d=>{all=d.filter(priority);total.textContent=all.length;today.textContent=all.filter(e=>status(e)==='今日截止').length;week.textContent=all.filter(e=>status(e)==='本周截止').length;['全部','今日截止','本周截止','报名中'].forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{filter=x;[...filters.children].forEach(n=>n.classList.toggle('active',n===b));render()};filters.append(b)});filters.firstChild.className='active';[...new Set(all.map(e=>e.province))].forEach(x=>region.add(new Option(x)));region.onchange=render;render()}).catch(()=>list.textContent='赛事数据暂时无法读取，请稍后刷新。');</script>
