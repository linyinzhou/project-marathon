<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Marathon</title><style>body{margin:0;background:#f6f8f5;color:#13231b;font:15px Arial,"Microsoft YaHei",sans-serif}main{max-width:960px;margin:auto;padding:36px 18px}h1{margin:6px 0;font-size:38px}.eyebrow{color:#137547;font-weight:bold;letter-spacing:1px;font-size:12px}.sub,.meta{color:#66756b}.stats{display:flex;gap:28px;border-bottom:1px solid #dce5df;padding:20px 0}.stats b{display:block;font-size:26px}.filters{display:flex;gap:8px;justify-content:space-between;padding:20px 0}button,select{background:#fff;border:1px solid #ccd8cf;padding:9px 12px}button.active{background:#13231b;color:#fff}.list{display:grid;gap:10px}article{background:#fff;border:1px solid #dce5df;padding:17px;display:flex;justify-content:space-between;gap:16px}h2{font-size:17px;margin:6px 0}.tag{color:#137547;font-weight:bold;font-size:12px}.today{color:#c84331}.deadline{text-align:right}.deadline a{display:block;color:#137547;margin-top:7px;font-size:13px}@media(max-width:600px){h1{font-size:30px}.filters,article{flex-direction:column}.filters div{display:flex;overflow:auto}.filters button{white-space:nowrap}.deadline{text-align:left}}</style></head><body><main><p class="eyebrow">PROJECT MARATHON</p><h1>重点赛事赛历</h1><p class="sub">只保留 A 类、一二线城市和金牌、白金标、锦标赛事。</p><div class="stats"><span><b id="total">-</b>重点赛事</span><span><b id="today">-</b>今日截止</span><span><b id="week">-</b>本周截止</span></div><section class="filters"><div id="filters"></div><select id="region"><option>全部地区</option></select></section><section class="list" id="list">正在读取最新赛事数据...</section></main><script>const url='https://raw.githubusercontent.com/linyinzhou/project-marathon/main/data/events.json',cities=['北京','上海','广州','深圳','成都','重庆','杭州','武汉','西安','天津','苏州','南京','长沙','郑州','青岛','厦门','济南'];let all=[],filter='全部';const f=v=>v?new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Shanghai'}).format(new Date(v)):'待公布',s=e=>{let d=(new Date(e.registration_end)-Date.now())/864e5;return d<1?'今日截止':d<=7?'本周截止':'报名中'},p=e=>e.category==='A类'||cities.some(c=>(e.name+e.province).includes(c))||/金牌|金标|白金|锦标/.test(e.name);function render(){let shown=all.filter(e=>(filter==='全部'||s(e)===filter)&&(region.value==='全部地区'||e.province===region.value)).sort((a,b)=>(a.registration_end||'').localeCompare(b.registration_end||''));list.innerHTML=shown.map(e=>`<article><div><span class="tag ${s(e)==='今日截止'?'today':''}">${s(e)}</span><h2>${e.name}</h2><p class="meta">${e.province} · 比赛 ${f(e.race_date)} · ${e.category}</p></div><div class="deadline">报名截止<br><b>${f(e.registration_end)}</b><a target="_blank" href="${e.source_url}">查看来源</a></div></article>`).join('')||'没有符合筛选条件的赛事。'}fetch(url).then(r=>r.json()).then(data=>{all=data.filter(p);total.textContent=all.length;today.textContent=all.filter(e=>s(e)==='今日截止').length;week.textContent=all.filter(e=>s(e)==='本周截止').length;['全部','今日截止','本周截止','报名中'].forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{filter=x;[...filters.children].forEach(n=>n.classList.toggle('active',n===b));render()};filters.append(b)});filters.firstChild.className='active';[...new Set(all.map(e=>e.province))].forEach(x=>region.add(new Option(x)));region.onchange=render;render()}).catch(()=>list.textContent='赛事数据暂时无法读取，请稍后刷新。');</script></body></html>
