<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Marathon</title>
<style>
  :root{color-scheme:dark}body{margin:0;background:#101512;color:#edf5ef;font:15px Arial,"Microsoft YaHei",sans-serif}main{max-width:960px;margin:auto;padding:38px 18px}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.eyebrow{color:#55d595;letter-spacing:1.5px;font-size:12px;font-weight:bold;margin:0}.updated{color:#7f9185;font-size:12px;margin:0;font-variant-numeric:tabular-nums}h1{font-size:38px;margin:8px 0}.sub,.meta{color:#a9b7ae}.stats{display:flex;gap:30px;border-bottom:1px solid #2b382f;padding:20px 0}.stats b{display:block;font-size:27px}.filters{display:flex;justify-content:space-between;padding:20px 0;gap:12px}button,select{background:#18221c;color:#dce8df;border:1px solid #3b4b41;padding:9px 12px}button.active{background:#55d595;color:#102116;border-color:#55d595}.list{display:grid;gap:10px}article{background:#18221c;border:1px solid #2d3b32;padding:18px;display:flex;justify-content:space-between;gap:16px;box-shadow:0 10px 24px #05080633}h2{font-size:17px;margin:7px 0}.tag{color:#55d595;font-size:12px;font-weight:bold}.registered{margin-left:8px;color:#8bbcff}.race-clock{color:#f3cf65;font-weight:bold}.today{color:#ff8271}.deadline{text-align:right}.deadline a{display:block;color:#65dca0;margin-top:7px;font-size:13px}@media(max-width:600px){main{padding:30px 16px}h1{font-size:30px}.filters,article{flex-direction:column}.filters div{display:flex;overflow:auto}.filters button{white-space:nowrap}.deadline{text-align:left}}
</style>
<main>
  <div class="topline"><p class="eyebrow">PROJECT MARATHON</p><p class="updated" id="updated">数据刷新时间待确认</p></div>
  <h1>重点赛事赛历</h1>
  <p class="sub">只保留值得占用一个周末的比赛。</p>
  <div class="stats">
    <span><b id="total">-</b>重点赛事</span>
    <span><b id="today">-</b>今日截止</span>
    <span><b id="week">-</b>本周截止</span>
  </div>
  <section class="filters"><div id="filters"></div><select id="region"><option>全部地区</option></select></section>
  <section id="list" class="list">正在读取最新赛事数据...</section>
</main>
<script>
const cities=['北京','上海','广州','深圳','成都','重庆','杭州','武汉','西安','天津','苏州','南京','长沙','郑州','青岛','厦门','济南'];
let all=[],filter='全部';
const fmt=v=>v?new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Shanghai'}).format(new Date(v)):'待公布';
const fmtUpdated=v=>new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Shanghai'}).format(new Date(v));
const fmtRace=e=>e.race_date?new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'numeric',day:'numeric',timeZone:'Asia/Shanghai'}).format(new Date(e.race_date)):'待公布';
const sourceLink=e=>e.source_url?`<a href="${e.source_url}" target="_blank">查看来源</a>`:'';
const registrationPeriod=e=>e.registration_start&&e.registration_end?fmt(e.registration_start)+' → '+fmt(e.registration_end):e.registration_start?'开始 '+fmt(e.registration_start):e.registration_end?'截止 '+fmt(e.registration_end):'';
const dayStamp=v=>{let p={};new Intl.DateTimeFormat('en',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(v)).forEach(x=>p[x.type]=x.value);return Date.UTC(+p.year,+p.month-1,+p.day)};
const sixMonthsAgo=()=>{let p={};new Intl.DateTimeFormat('en',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return Date.UTC(+p.year,+p.month-7,+p.day)};
const status=e=>{
  let today=dayStamp(Date.now());
  if(e.registration_start){
    let start=dayStamp(e.registration_start);
    if(start>today)return start<=today+7*864e5?'准备报名':'报名未开始';
  }
  if(e.registration_end){
    let end=dayStamp(e.registration_end);
    if(end<today)return '报名已截止';
    if(end===today)return '今日截止';
    if(end<=today+7*864e5)return '本周截止';
  }
  if(e.registration_status==='upcoming')return '准备报名';
  if(e.registration_status==='closed')return '报名已截止';
  return '报名中';
};
const trailStatus=e=>{
  if(e.race_date&&dayStamp(e.race_date)<dayStamp(Date.now()))return '报名已截止';
  if(e.registration_status==='upcoming')return '准备报名';
  if(e.registration_status==='closed')return '报名已截止';
  if(e.registration_status==='open')return '报名中';
  return status(e);
};
const raceClock=e=>{if(!e.race_date)return '比赛日期待公布';let d=Math.round((dayStamp(e.race_date)-dayStamp(Date.now()))/864e5);return d>0?'距比赛 '+d+' 天':d===0?'今天比赛':'比赛结束已经 '+(-d)+' 天'};
const priority=e=>e.category==='A类'||e.category==='日本重点赛事'||cities.some(c=>(e.name+e.province).includes(c))||/金牌|金标|白金|标牌/.test(e.name);
const isTrail=e=>e.discipline==='trail';
const isChina=e=>!e.country||e.country==='中国';
const isChinaRoad=e=>isChina(e)&&!isTrail(e);

function render(){
  let overseas=filter==='海外赛事',trail=filter==='越野赛';
  region.style.visibility=overseas||trail?'hidden':'visible';
  let x=all.filter(e=>{
    if(overseas)return !isChina(e)&&!isTrail(e);
    if(trail)return isTrail(e)&&e.race_date&&dayStamp(e.race_date)>=sixMonthsAgo();
    return isChinaRoad(e)&&(filter==='已报名'?e.registered:filter==='全部'||status(e)===filter)&&(region.value==='全部地区'||e.province===region.value);
  }).sort((a,b)=>filter==='报名中'
    ? (new Date(b.first_seen_at||0)-new Date(a.first_seen_at||0))||(a.source_rank-b.source_rank)
    : trail
      ? new Date(b.race_date).getTime()-new Date(a.race_date).getTime()
    : (a.race_date?new Date(a.race_date).getTime():Infinity)-(b.race_date?new Date(b.race_date).getTime():Infinity));
  if(overseas){
    list.innerHTML=x.map(e=>`<article><div><h2>${e.name}</h2><p class="meta">比赛日期 ${fmtRace(e)}</p>${registrationPeriod(e)?`<p class="meta">报名时间 ${registrationPeriod(e)}</p>`:''}</div></article>`).join('')||'没有符合筛选条件的赛事。';
    return;
  }
  if(trail){
    list.innerHTML=x.map(e=>`<article><div><span class="tag">${trailStatus(e)}</span><h2>${e.name}</h2><p class="meta">比赛日期 ${fmtRace(e)}</p></div></article>`).join('')||'没有符合筛选条件的赛事。';
    return;
  }
  list.innerHTML=x.map(e=>`<article><div><span class="tag ${status(e)==='今日截止'?'today':''}">${status(e)}</span>${e.registered?'<span class="tag registered">已报名</span>':''}<h2>${e.name}</h2><p class="meta">${e.province} · 比赛 ${fmtRace(e)} · ${e.category}</p>${e.registered?'<p class="race-clock">'+raceClock(e)+'</p>':''}</div>${e.registration_end?`<div class="deadline">报名截止<br><b>${fmt(e.registration_end)}</b>${sourceLink(e)}</div>`:e.source_url?`<div class="deadline">${sourceLink(e)}</div>`:''}</article>`).join('')||'没有符合筛选条件的赛事。';
}

Promise.all(['events.json','registrations.json'].map(file=>fetch('https://raw.githubusercontent.com/linyinzhou/project-marathon/main/data/'+file+'?v='+Date.now()).then(r=>{if(!r.ok)throw new Error(file);return r.json()}))).then(([d,registered])=>{
  let checkedAt=d.map(e=>Date.parse(e.last_checked_at)).filter(Number.isFinite);
  if(checkedAt.length)document.getElementById('updated').textContent='数据刷新 '+fmtUpdated(Math.max(...checkedAt));
  let keys=new Set(registered.map(e=>e.name+'|'+(e.race_date||'')));
  let sourceRanks=new Map(d.map((e,index)=>[e.name+'|'+(e.race_date||''),index]));
  all=[...new Map([...registered,...d.filter(e=>isTrail(e)||priority(e))].map(e=>{let key=e.name+'|'+(e.race_date||'');return[key,{...e,registered:keys.has(key),source_rank:sourceRanks.get(key)??Number.MAX_SAFE_INTEGER}]})).values()];
  let china=all.filter(isChinaRoad);
  total.textContent=china.length;
  today.textContent=china.filter(e=>status(e)==='今日截止').length;
  week.textContent=china.filter(e=>status(e)==='本周截止').length;
  ['全部','已报名','准备报名','今日截止','本周截止','报名中','海外赛事','越野赛'].forEach(x=>{
    let b=document.createElement('button');b.textContent=x;b.onclick=()=>{filter=x;[...filters.children].forEach(n=>n.classList.toggle('active',n===b));render()};filters.append(b);
  });
  filters.firstChild.className='active';
  [...new Set(china.map(e=>e.province))].forEach(x=>region.add(new Option(x)));
  region.onchange=render;
  render();
}).catch(()=>list.textContent='赛事数据暂时无法读取，请稍后刷新。');
</script>
